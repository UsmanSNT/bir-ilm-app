<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` telefon ekranining to'liq maydonini beradi;
      "tirqish" va pastki chiziqni `env(safe-area-inset-*)` hisobga oladi
      (mobile/native.css ga qarang). Bu app/layout.tsx dagi viewport bilan
      bir xil, shuning uchun UI webdagi bilan aynan bir xil ko'rinadi.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4f7f5" />
    <!-- Native qobiqda telefon raqamlarini avtomatik link qilmasin. -->
    <meta name="format-detection" content="telephone=no" />
    <title>Bir Ilm</title>
    <!-- Ochilish animatsiyasi (mobile/intro.ts). CSS shu yerda: asosiy uslublar yuklanguncha ham ko'rinsin. -->
    <style>
      #intro { position: fixed; inset: 0; z-index: 2147483000; background: #f4fafe; transition: opacity .45s ease; }
      /* contain: ekran nisbati qanday bo'lmasin, belgi kesilmaydi; bo'sh joy videoning o'z fon rangi. */
      #intro video { display: block; width: 100%; height: 100%; object-fit: contain; }
      #intro.is-done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body class="antialiased">
    <div id="intro" aria-hidden="true">
      <video src="/assets/bir-ilm-splash.mp4" muted playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
